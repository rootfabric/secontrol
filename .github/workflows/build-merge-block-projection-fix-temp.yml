name: Build Merge Block Projection Fix R3

on:
  push:
    branches:
      - build/merge-block-projection-fix-r3
    paths:
      - 'tools/merge-block-projection-fix/**'
      - '.github/workflows/build-merge-block-projection-fix-temp.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Build Release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet build tools/merge-block-projection-fix/MergeBlockProjectionFix.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw "dotnet build exited $LASTEXITCODE" }

      - name: Verify assembly contract
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $bin = Join-Path $env:GITHUB_WORKSPACE 'tools\merge-block-projection-fix\bin\Release\net48'
          $plugin = Join-Path $bin 'MergeBlockProjectionFix.dll'
          $harmony = Join-Path $bin '0Harmony.dll'
          if (!(Test-Path $plugin)) { throw "Plugin DLL missing: $plugin" }
          if (!(Test-Path $harmony)) { throw "Harmony DLL missing: $harmony" }

          $asm = [Reflection.Assembly]::ReflectionOnlyLoadFrom($plugin)
          $refs = $asm.GetReferencedAssemblies()
          $vrage = $refs | Where-Object Name -eq 'VRage'
          if ($null -eq $vrage) { throw "Plugin does not reference VRage" }
          if ($vrage.Version.ToString() -ne '1.0.0.0') {
            throw "Unexpected VRage reference version: $($vrage.Version)"
          }
          if ($vrage.GetPublicKeyToken().Length -ne 0) {
            throw "Unexpected strong-named VRage reference"
          }

          "Plugin: $($asm.FullName)"
          "VRage reference: $($vrage.FullName)"
          Get-FileHash $plugin -Algorithm SHA256
          Get-FileHash $harmony -Algorithm SHA256

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:GITHUB_WORKSPACE 'artifact'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          $bin = Join-Path $env:GITHUB_WORKSPACE 'tools\merge-block-projection-fix\bin\Release\net48'
          Copy-Item (Join-Path $bin 'MergeBlockProjectionFix.dll') $out
          Copy-Item (Join-Path $bin '0Harmony.dll') $out
          Copy-Item 'tools\merge-block-projection-fix\README.md' $out

          @(
            "MergeBlockProjectionFix R3",
            "Build commit: $env:GITHUB_SHA",
            "",
            (Get-FileHash (Join-Path $out 'MergeBlockProjectionFix.dll') -Algorithm SHA256 | Out-String).Trim(),
            (Get-FileHash (Join-Path $out '0Harmony.dll') -Algorithm SHA256 | Out-String).Trim()
          ) | Set-Content (Join-Path $out 'SHA256.txt')

          Compress-Archive -Path (Join-Path $out '*') -DestinationPath (Join-Path $env:GITHUB_WORKSPACE 'MergeBlockProjectionFix-R3.zip') -Force

      - uses: actions/upload-artifact@v4
        with:
          name: MergeBlockProjectionFix-R3
          path: |
            artifact/*
            MergeBlockProjectionFix-R3.zip
          if-no-files-found: error
